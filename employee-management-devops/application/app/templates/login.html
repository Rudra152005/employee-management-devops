{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block unauth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 85vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card content-card shadow-lg p-4">
      <div class="text-center mb-4">
        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
          <i class="fa-solid fa-cube fs-2"></i>
        </div>
        <h3 class="fw-bold text-dark">Employee Portal</h3>
        <p class="text-muted small">Employee & Infrastructure Management System</p>
      </div>

      <!-- Quick Demo Credentials Box -->
      <div class="alert alert-info py-2 px-3 mb-3 small d-flex align-items-center">
        <i class="fa-solid fa-circle-info me-2 fs-5"></i>
        <div>
          Demo Admin: <strong>admin</strong> / <strong>Admin@12345</strong>
        </div>
      </div>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold small text-muted">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="username" name="username" value="admin" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold small text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0" id="password" name="password" value="Admin@12345" required>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
            <label class="form-check-label small text-muted" for="remember">Remember me</label>
          </div>
          <span class="small text-muted">Protected by RBAC</span>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary btn-lg fs-6 fw-semibold">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In
          </button>
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Deployed via AWS Multi-AZ Architecture</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
