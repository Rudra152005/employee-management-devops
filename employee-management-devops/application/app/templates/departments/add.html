{% extends "base.html" %}

{% block title %}Add Department{% endblock %}
{% block page_title %}New Department Creation{% endblock %}

{% block page_actions %}
<a href="{{ url_for('department.index') }}" class="btn btn-outline-secondary btn-sm">
  <i class="fa-solid fa-arrow-left me-1"></i> Back to Departments
</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card content-card p-4">
      <h5 class="fw-bold mb-4 text-dark border-bottom pb-2">Department Details</h5>

      <form method="POST" action="{{ url_for('department.add') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small text-muted">Department Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="name" required placeholder="e.g. Quality Assurance">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small text-muted">Department Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="code" required placeholder="e.g. QA" style="text-transform: uppercase;">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small text-muted">Annual Budget ($)</label>
          <input type="number" step="0.01" min="0" class="form-control" name="budget" placeholder="100000.00" value="0.00">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small text-muted">Description</label>
          <textarea class="form-control" name="description" rows="3" placeholder="Core functions and responsibilities..."></textarea>
        </div>

        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
          <a href="{{ url_for('department.index') }}" class="btn btn-light me-2">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">
            <i class="fa-solid fa-check me-1"></i> Create Department
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
