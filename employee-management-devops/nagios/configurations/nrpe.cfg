# NRPE Client Configuration (nrpe.cfg)
# Location on monitored agents: /etc/nagios/nrpe.cfg

pid_file=/var/run/nagios/nrpe.pid
server_port=5666
nrpe_user=nagios
nrpe_group=nagios

# Only accept connections from the Nagios monitoring host
allowed_hosts=127.0.0.1,::1,10.0.1.80

dont_blame_nrpe=0
allow_bash_command_substitution=0
debug=0
command_timeout=60
connection_timeout=300

# Monitored Command Definitions
command[check_users]=/usr/lib/nagios/plugins/check_users -w 5 -c 10
command[check_load]=/usr/lib/nagios/plugins/check_load -r -w 0.8,0.7,0.6 -c 0.95,0.85,0.75
command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_mem]=/usr/lib/nagios/plugins/check_mem.sh -w 80 -c 90
command[check_total_procs]=/usr/lib/nagios/plugins/check_procs -w 150 -c 200
command[check_zombie_procs]=/usr/lib/nagios/plugins/check_procs -w 5 -c 10 -s Z
