# Nagios Host Definitions (hosts.cfg)

# Base Linux Server Host Template
define host {
    name                            linux-server
    use                             generic-host
    check_period                    24x7
    check_interval                  5
    retry_interval                  1
    max_check_attempts              3
    check_command                   check-host-alive
    notification_period             24x7
    notification_interval           30
    notification_options            d,u,r
    contact_groups                  devops-admins
    register                        0
}

# Web Server 01 (Application + Database Node)
define host {
    use                             linux-server
    host_name                       web-server-01
    alias                           Primary Web Application & DB Server
    address                         172.31.41.56
    hostgroups                      app-servers,db-servers,linux-servers
}

# Web Server 02 (Application Node)
define host {
    use                             linux-server
    host_name                       web-server-02
    alias                           Secondary Web Application Server
    address                         172.31.44.210
    hostgroups                      app-servers,linux-servers
}

# Hostgroups
define hostgroup {
    hostgroup_name                  app-servers
    alias                           Application Fleet
    members                         web-server-01,web-server-02
}

define hostgroup {
    hostgroup_name                  db-servers
    alias                           Database Cluster
    members                         web-server-01
}
