# Nagios Host Definitions (hosts.cfg)

# Base Linux Server Host Template
define host {
    name                            linux-server
    use                             generic-host
    check_period                    24x7
    check_interval                  5
    retry_interval                  1
    max_check_attempts              3
    check_command                   check-host-alive
    notification_period             24x7
    notification_interval           30
    notification_options            d,u,r
    contact_groups                  devops-admins
    register                        0
}

# Application Server 01
define host {
    use                             linux-server
    host_name                       app-server-01
    alias                           Primary Application Server
    address                         10.0.10.11
    hostgroups                      app-servers,linux-servers
}

# Application Server 02
define host {
    use                             linux-server
    host_name                       app-server-02
    alias                           Secondary Application Server
    address                         10.0.11.12
    hostgroups                      app-servers,linux-servers
}

# Database Server 01
define host {
    use                             linux-server
    host_name                       db-server-01
    alias                           Primary MySQL RDS Node
    address                         10.0.20.15
    hostgroups                      db-servers,linux-servers
}

# Application Load Balancer
define host {
    use                             generic-host
    host_name                       alb-prod
    alias                           AWS Application Load Balancer
    address                         10.0.1.50
    check_command                   check_http_health
    hostgroups                      load-balancers
}

# Hostgroups
define hostgroup {
    hostgroup_name                  app-servers
    alias                           Application Fleet
    members                         app-server-01,app-server-02
}

define hostgroup {
    hostgroup_name                  db-servers
    alias                           Database Cluster
    members                         db-server-01
}

define hostgroup {
    hostgroup_name                  load-balancers
    alias                           Public Load Balancers
    members                         alb-prod
}
