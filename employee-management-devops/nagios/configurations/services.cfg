# Nagios Service Definitions (services.cfg)

# Ping Check for all linux servers
define service {
    use                             generic-service
    hostgroup_name                  app-servers,db-servers
    service_description             PING
    check_command                   check_ping!100.0,20%!500.0,60%
    notification_interval           60
}

# SSH Access Check
define service {
    use                             generic-service
    hostgroup_name                  app-servers,db-servers
    service_description             SSH Service
    check_command                   check_ssh
    notification_interval           60
}

# Application HTTP Health Endpoint Check (/health)
define service {
    use                             generic-service
    hostgroup_name                  app-servers
    service_description             Flask App Health Probe
    check_command                   check_http_health
    check_interval                  1
    retry_interval                  1
    max_check_attempts              2
    notification_interval           15
    notification_options            w,c,r
}

# MySQL Database Port 3306 Check
define service {
    use                             generic-service
    hostgroup_name                  db-servers
    service_description             MySQL Connectivity (Port 3306)
    check_command                   check_tcp!3306
    check_interval                  2
    retry_interval                  1
    max_check_attempts              3
    notification_interval           15
}

# NRPE CPU Load Check
define service {
    use                             generic-service
    hostgroup_name                  app-servers,db-servers
    service_description             CPU Load via NRPE
    check_command                   check_nrpe!check_load
    check_interval                  5
}

# NRPE Disk Space Root Check
define service {
    use                             generic-service
    hostgroup_name                  app-servers,db-servers
    service_description             Root Filesystem Space
    check_command                   check_nrpe!check_disk
    check_interval                  10
}

# NRPE Memory Usage Check
define service {
    use                             generic-service
    hostgroup_name                  app-servers,db-servers
    service_description             Memory Usage
    check_command                   check_nrpe!check_mem
    check_interval                  5
}
