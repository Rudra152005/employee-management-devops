# Nagios Contact Definitions (contacts.cfg)

define contact {
    contact_name                    devopsadmin
    use                             generic-contact
    alias                           Lead DevOps Engineer
    email                           devops-oncall@enterprise.devops
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r
    host_notification_options       d,u,r
    service_notification_commands   notify-service-by-email
    host_notification_commands      notify-host-by-email
}

define contact {
    contact_name                    sreteam
    use                             generic-contact
    alias                           Site Reliability Engineers
    email                           sre-team@enterprise.devops
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    c,r
    host_notification_options       d,r
    service_notification_commands   notify-service-by-email
    host_notification_commands      notify-host-by-email
}

define contactgroup {
    contactgroup_name               devops-admins
    alias                           Primary DevOps & SRE On-Call Group
    members                         devopsadmin,sreteam
}
