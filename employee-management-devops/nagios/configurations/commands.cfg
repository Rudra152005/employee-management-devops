# Nagios Command Definitions (commands.cfg)

# Application Health Check Probe Command
define command {
    command_name    check_http_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 5000 -u /health -e "200" -t 5
}

# TCP Port Check Command (e.g. MySQL 3306)
define command {
    command_name    check_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -t 5
}

# Generic NRPE Plugin Execution Command
define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

# Notification Command: Alert by Email for Services
define command {
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios Service Alert *****\n\nNotification Type: $NOTIFICATIONTYPE$\n\nService: $SERVICEDESC$\nHost: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $SERVICESTATE$\n\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n\n$SERVICEOUTPUT$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Service Alert: $HOSTALIAS$/$SERVICEDESC$ is $SERVICESTATE$ **" $CONTACTEMAIL$
}

# Notification Command: Alert by Email for Hosts
define command {
    command_name    notify-host-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios Host Alert *****\n\nNotification Type: $NOTIFICATIONTYPE$\nHost: $HOSTNAME$\nState: $HOSTSTATE$\nAddress: $HOSTADDRESS$\nInfo: $HOSTOUTPUT$\n\nDate/Time: $LONGDATETIME$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Host Alert: $HOSTNAME$ is $HOSTSTATE$ **" $CONTACTEMAIL$
}
