---
- name: Install Nginx web server
  apt:
    name: nginx
    state: present

- name: Remove default Nginx site configuration
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy reverse proxy configuration
  template:
    src: employee-app.conf.j2
    dest: /etc/nginx/sites-available/employee-app.conf
    owner: root
    group: root
    mode: '0644'

- name: Enable employee-app site configuration
  file:
    src: /etc/nginx/sites-available/employee-app.conf
    dest: /etc/nginx/sites-enabled/employee-app.conf
    state: link

- name: Validate Nginx configuration syntax
  command: nginx -t
  changed_when: false

- name: Ensure Nginx is running and enabled
  service:
    name: nginx
    state: restarted
    enabled: yes
