[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/devops_key.pem
ansible_python_interpreter=/usr/bin/python3

[loadbalancer]
lb-01.internal ansible_host=10.0.1.50

[app_servers]
app-01.internal ansible_host=10.0.10.11
app-02.internal ansible_host=10.0.11.12

[db_servers]
db-01.internal ansible_host=10.0.20.15

[monitoring]
mon-01.internal ansible_host=10.0.1.80

[webservers:children]
app_servers
loadbalancer
